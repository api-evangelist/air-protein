aid: air-protein
name: Air Protein
description: 'Air Protein is a Bay Area food-technology company producing a nutrient-dense,
  meat-alternative protein made from elements found in the air. Its carbon-conversion
  fermentation process — derived from NASA closed-loop life-support research — combines
  carbon dioxide, oxygen, nitrogen, water and renewable energy with hydrogenotrophic
  microbes to grow a protein flour, which it then transforms into whole-food "air meat"
  products. Founded by CEO Dr. Lisa Dyson, the company aims to decouple protein production
  from land and animal agriculture. Added to the API Evangelist network as a portfolio
  company of GV; it publishes a marketing site but no developer API surface.'
